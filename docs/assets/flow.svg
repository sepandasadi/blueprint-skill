<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Blueprint workflow: interview, validate, plan, review, gate 1, split, deep review, gate 2, parallel build, converge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .box{fill:#1e293b;stroke:#334155;stroke-width:1.5;rx:12}
      .hot{fill:#172554;stroke:#3b82f6}
      .gate{fill:#3f1d1d;stroke:#f87171;stroke-width:2;rx:12}
      .t{font:600 16px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#f8fafc}
      .s{font:400 11.5px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .n{font:700 11px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#60a5fa;letter-spacing:.08em}
      .h{font:600 22px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#f8fafc}
      .l{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    </style>
  </defs>
  <rect width="1200" height="440" fill="url(#bg)" rx="18"/>
  <text x="40" y="48" class="h">How <tspan fill="#60a5fa">blueprint</tspan> turns "build me X" into shipped code</text>
  <text x="40" y="72" class="s" style="font-size:13px">Nothing is built before both gates are approved. Every phase writes a file you can read, diff and resume from.</text>
  <g transform="translate(40,100)">
    <rect class="box" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 1</text>
    <text x="16" y="50" class="t">Interview</text>
    <text x="16" y="72" class="s">3 tracks · 8–15 questions</text>
    <text x="16" y="90" class="s">one at a time · recommended</text>
  </g>
  <path class="l" d="M240,150 H268"/>
  <g transform="translate(270,100)">
    <rect class="box" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 2</text>
    <text x="16" y="50" class="t">Validate</text>
    <text x="16" y="72" class="s">R ↔ D ↔ T traceability</text>
    <text x="16" y="90" class="s">6 consistency passes</text>
  </g>
  <path class="l" d="M470,150 H498"/>
  <g transform="translate(500,100)">
    <rect class="box" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 3</text>
    <text x="16" y="50" class="t">Plan</text>
    <text x="16" y="72" class="s">tasks W### [P] · critical path</text>
    <text x="16" y="90" class="s">rulings · ambiguities empty</text>
  </g>
  <path class="l" d="M700,150 H728"/>
  <g transform="translate(730,100)">
    <rect class="box hot" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 4</text>
    <text x="16" y="50" class="t">Review the plan</text>
    <text x="16" y="72" class="s">bugs · performance · security</text>
    <text x="16" y="90" class="s">fresh-context reviewer</text>
  </g>
  <path class="l" d="M930,150 H958"/>
  <g transform="translate(960,100)">
    <rect class="gate" width="200" height="100"/>
    <text x="16" y="24" class="n" fill="#fca5a5">GATE 1</text>
    <text x="16" y="50" class="t">You approve</text>
    <text x="16" y="72" class="s">explicit yes required</text>
    <text x="16" y="90" class="s">optional quiz</text>
  </g>
  <path class="l" d="M1060,200 V232 H140 V258"/>
  <g transform="translate(40,260)">
    <rect class="box" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 5</text>
    <text x="16" y="50" class="t">Split</text>
    <text x="16" y="72" class="s">2–4 plans by file ownership</text>
    <text x="16" y="90" class="s">progress log per plan</text>
  </g>
  <path class="l" d="M240,310 H268"/>
  <g transform="translate(270,260)">
    <rect class="box hot" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 6</text>
    <text x="16" y="50" class="t">Deep review</text>
    <text x="16" y="72" class="s">+ DRY across plans · docs</text>
    <text x="16" y="90" class="s">no refactor needed</text>
  </g>
  <path class="l" d="M470,310 H498"/>
  <g transform="translate(500,260)">
    <rect class="gate" width="200" height="100"/>
    <text x="16" y="24" class="n" fill="#fca5a5">GATE 2</text>
    <text x="16" y="50" class="t">You approve</text>
    <text x="16" y="72" class="s">branch choice</text>
    <text x="16" y="90" class="s">coverage verdicts</text>
  </g>
  <path class="l" d="M700,310 H728"/>
  <g transform="translate(730,260)">
    <rect class="box" width="200" height="100"/>
    <text x="16" y="24" class="n">PHASE 7</text>
    <text x="16" y="50" class="t">Build in parallel</text>
    <text x="16" y="72" class="s">one agent per plan · ledger</text>
    <text x="16" y="90" class="s">orchestrator commits</text>
  </g>
  <path class="l" d="M930,310 H958"/>
  <g transform="translate(960,260)">
    <rect class="box" width="200" height="100"/>
    <text x="16" y="24" class="n">FINISH</text>
    <text x="16" y="50" class="t">Converge</text>
    <text x="16" y="72" class="s">code vs requirements</text>
    <text x="16" y="90" class="s">claims ≠ evidence</text>
  </g>
  <text x="40" y="412" class="s" style="font-size:12px">docs/plans/&lt;date&gt;-&lt;feature&gt;/   requirements.md · design.md · testing.md · plan.md · impl-01.md … impl-04.md</text>
</svg>
