<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Simple mode versus advanced mode">
  <defs><style>
    .card{fill:#0f172a;stroke:#334155;stroke-width:1.5}
    .t{font:700 20px -apple-system,Segoe UI,Inter,sans-serif;fill:#f8fafc}
    .s{font:400 14px -apple-system,Segoe UI,Inter,sans-serif;fill:#cbd5e1}
    .k{font:600 14px -apple-system,Segoe UI,Inter,sans-serif;fill:#93c5fd}
  </style></defs>
  <rect width="1200" height="260" fill="#020617" rx="18"/>
  <g transform="translate(30,30)">
    <rect class="card" width="555" height="200" rx="14"/>
    <text x="24" y="38" class="t">Simple mode <tspan class="s">— contained feature in an existing codebase</tspan></text>
    <text x="24" y="74" class="k">Interview</text><text x="150" y="74" class="s">one combined batch of 10–15 questions, rest defaulted + tagged [inferred]</text>
    <text x="24" y="102" class="k">Review</text><text x="150" y="102" class="s">one combined bugs / perf / security pass</text>
    <text x="24" y="130" class="k">Plans</text><text x="150" y="130" class="s">1–2 implementation plans</text>
    <text x="24" y="158" class="k">Gates</text><text x="150" y="158" class="s">both, short form — never skipped</text>
    <text x="24" y="186" class="k">Pick when</text><text x="150" y="186" class="s">≤ ~5 files, no money / auth / personal data</text>
  </g>
  <g transform="translate(615,30)">
    <rect class="card" width="555" height="200" rx="14" stroke="#3b82f6"/>
    <text x="24" y="38" class="t">Advanced mode <tspan class="s">— new app, or anything risky</tspan></text>
    <text x="24" y="74" class="k">Interview</text><text x="150" y="74" class="s">3 batches (requirements, design, testing), 8–15 each, 2 follow-ups</text>
    <text x="24" y="102" class="k">Review</text><text x="150" y="102" class="s">fresh-context reviewer, 3 separate passes + builder check, ≤ 3 cycles</text>
    <text x="24" y="130" class="k">Plans</text><text x="150" y="130" class="s">2–4 implementation plans, parallel agents where supported</text>
    <text x="24" y="158" class="k">Gates</text><text x="150" y="158" class="s">both, full summary, rulings, optional quiz</text>
    <text x="24" y="186" class="k">Pick when</text><text x="150" y="186" class="s">greenfield, payments, auth, PII, > 5 files</text>
  </g>
</svg>
