<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Simple mode versus advanced mode">
  <defs><style>
    .card{fill:#0f172a;stroke:#334155;stroke-width:1.5}
    .t{font:700 20px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#f8fafc}
    .s{font:400 14px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#cbd5e1}
    .k{font:600 14px -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#93c5fd}
  </style></defs>
  <rect width="1200" height="330" fill="#020617" rx="18"/>
  <g transform="translate(30,30)">
    <rect class="card" width="555" height="270" rx="14" stroke="#334155"/>
    <text x="24" y="38" class="t">Simple mode <tspan class="s">— contained feature in an existing codebase</tspan></text>
    <text x="24" y="76" class="k">Interview</text>
    <text x="150" y="76" class="s">one combined sequence of 10–15 questions;</text>
    <text x="150" y="94" class="s">everything else defaulted and tagged [inferred]</text>
    <text x="24" y="126" class="k">Review</text>
    <text x="150" y="126" class="s">one combined bugs / performance / security pass</text>
    <text x="24" y="158" class="k">Plans</text>
    <text x="150" y="158" class="s">1–2 implementation plans</text>
    <text x="24" y="190" class="k">Gates</text>
    <text x="150" y="190" class="s">both, short form — never skipped</text>
    <text x="24" y="222" class="k">Pick when</text>
    <text x="150" y="222" class="s">≤ ~5 files, no money / auth / personal data</text>
  </g>
  <g transform="translate(615,30)">
    <rect class="card" width="555" height="270" rx="14" stroke="#3b82f6"/>
    <text x="24" y="38" class="t">Advanced mode <tspan class="s">— new app, or anything risky</tspan></text>
    <text x="24" y="76" class="k">Interview</text>
    <text x="150" y="76" class="s">3 tracks (requirements, design, testing),</text>
    <text x="150" y="94" class="s">8–15 questions each, one at a time</text>
    <text x="24" y="126" class="k">Review</text>
    <text x="150" y="126" class="s">fresh-context reviewer, 3 separate passes,</text>
    <text x="150" y="144" class="s">builder check, up to 3 fix cycles</text>
    <text x="24" y="176" class="k">Plans</text>
    <text x="150" y="176" class="s">2–4 implementation plans, parallel agents</text>
    <text x="150" y="194" class="s">where the harness supports them</text>
    <text x="24" y="226" class="k">Gates</text>
    <text x="150" y="226" class="s">both, full summary, rulings, optional quiz</text>
    <text x="24" y="258" class="k">Pick when</text>
    <text x="150" y="258" class="s">greenfield, payments, auth, PII, > 5 files</text>
  </g>
</svg>
